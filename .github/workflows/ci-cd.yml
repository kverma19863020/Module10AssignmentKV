The failures all have the same root cause: the FastAPI app's lifespan handler calls Base.metadata.create_all(bind=engine) on startup, which connects to PostgreSQL — but no Postgres service is running in the CI environment when those tests run.

There are two things happening here:

Root cause 1: The lifespan connects to the real DB engine, not the test one. Even though conftest.py overrides get_db with a test session, the lifespan runs before the override takes effect and uses the production engine. So when TestClient(app) starts up, it tries to hit localhost:5432 with the real connection string.

Root cause 2 (likely): No Postgres service in CI. The GitHub Actions workflow probably doesn't spin up a Postgres service container, so even if the engine were correct, there's nothing to connect to.

Here's how to fix both:

Fix 1 — Add a Postgres service to your GitHub Actions workflow:

yaml
services:
  postgres:
    image: postgres:15
    env:
      POSTGRES_USER: kvuser
      POSTGRES_PASSWORD: kvpassword
      POSTGRES_DB: kvdb_test
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5
Fix 2 — Guard the lifespan create_all so it uses the test engine during tests. In app/main.py, the lifespan likely looks like:

python
@asynccontextmanager
async def lifespan(app):
    Base.metadata.create_all(bind=engine)
    yield
The problem is engine here is the module-level production engine. In your conftest.py, you need to also override the engine used by lifespan, or skip create_all in tests by having conftest create the tables itself before starting the app:

python
# In conftest.py, before the client fixture runs:
from app.database import Base, engine as test_engine

@pytest.fixture(scope="session", autouse=True)
def create_tables():
    Base.metadata.create_all(bind=test_engine)
    yield
    Base.metadata.drop_all(bind=test_engine)
And in app/main.py, make the lifespan create_all conditional or move table creation out of lifespan entirely (managing it via migrations like Alembic instead).

The most pragmatic fix for CI is Fix 1 — add the Postgres service block to your workflow YAML. The 10 API tests should then pass once Postgres is actually available on port 5432 with the expected credentials.

