version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kvuser
      POSTGRES_PASSWORD: kvpassword
      POSTGRES_DB: kvdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvuser -d kvdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kvuser
      POSTGRES_PASSWORD: kvpassword
      POSTGRES_DB: kvdb_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvuser -d kvdb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kvuser:kvpassword@db:5432/kvdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
